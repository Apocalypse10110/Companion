# Checks every push and pull request: lint, types, tests, production build.
# No secrets are needed: tests mock the AI and the accounts.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, behaviour and accessibility tests
        run: npm test
      - name: Production build
        run: npm run build
