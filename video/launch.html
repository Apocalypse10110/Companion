<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companion launch film</title>
<!--
  Companion launch film, 1920×1080.
  The film follows video/timeline.js (written by video/voice.py from the narration), so every beat, caption and
  picture is on cue with the voice. Everything is a pure function of time: window.render(t) draws frame t.
  Open this file in a browser to preview it in real time (click pauses; arrow keys seek 5 s).
-->
<script src="timeline.js"></script>
<style>
  @font-face { font-family: "Atkinson"; src: url(fonts/atkinson.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Fraunces"; src: url(fonts/fraunces.woff2) format("woff2"); font-weight: 300 600; font-style: normal; }
  @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-italic.woff2) format("woff2"); font-weight: 300 600; font-style: italic; }

  :root {
    --ink: #1d1813; --cream: #fbf8f3; --paper: #fffaf2; --line: #ddd3c5; --muted: #6a5e53;
    --accent: #ff8a3d; --accent2: #d4580a; --danger: #b0261b; --danger-soft: #fbe4df;
    --success: #1f6b3a; --success-soft: #e1f2e3; --sans: "Atkinson", system-ui, sans-serif; --serif: "Fraunces", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }

  .beat { position: absolute; inset: 0; display: none; overflow: hidden; }
  .beat.dark { background: radial-gradient(120% 90% at 50% 40%, #2a221c 0%, #1d1813 60%, #140f0c 100%); color: #fbf8f3; }
  .beat.cream { background: radial-gradient(120% 90% at 50% 40%, #fffdf9 0%, var(--cream) 55%, #efe6d9 100%); color: var(--ink); }
  .beat.orange { background: radial-gradient(120% 100% at 50% 40%, #ff9a52 0%, #d4580a 70%, #a8420a 100%); color: #1d1813; }
  .abs { position: absolute; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }

  /* grain + motion background (the "signal" feel) */
  #grain { position: absolute; left: -64px; top: -64px; width: 2048px; height: 1208px; pointer-events: none; opacity: .08; mix-blend-mode: overlay; z-index: 80; }
  .ring-bg { position: absolute; border-radius: 50%; border: 2px solid rgba(255,138,61,.35); }

  /* captions: white (or ink on cream), lowercase, big and bold, words light up as they are spoken */
  #caption { position: absolute; left: 220px; right: 220px; bottom: 96px; text-align: center; z-index: 60;
    font: 380 62px/1.22 var(--serif); font-variation-settings: "opsz" 72; letter-spacing: -.005em; text-shadow: 0 2px 18px rgba(0,0,0,.2); }
  #caption .w { display: inline-block; margin: 0 .09em; opacity: .32; transition: none; }
  #caption .w.on { opacity: 1; color: var(--accent); }
  .beat.cream + #caption, #stage.light #caption { color: var(--ink); }
  #caption .w.on.pop { }
  #brand { position: absolute; left: 90px; top: 70px; z-index: 60; display: flex; align-items: center; gap: 16px; font: 800 30px var(--sans); letter-spacing: .02em; }
  #brand svg { width: 52px; height: 52px; }

  /* phone mock */
  .phone { position: absolute; width: 452px; height: 924px; border-radius: 68px; background: #1d1813; padding: 13px;
    box-shadow: 0 0 0 2px #3a312a inset, 0 50px 110px -30px rgba(0,0,0,.6); }
  .phone .scr { position: relative; width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: var(--cream); color: var(--ink); }
  .phone .island { position: absolute; top: 14px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #0d0b09; z-index: 5; }
  .sbar { position: absolute; top: 16px; left: 40px; right: 36px; display: flex; justify-content: space-between; font: 700 19px var(--sans); z-index: 4; }
  .app { position: absolute; inset: 0; padding: 74px 22px 0; font-family: var(--sans); }
  .ahead { display: flex; align-items: center; gap: 12px; font: 800 30px var(--sans); margin: 0 4px 18px; }
  .ahead svg { width: 40px; height: 40px; }
  .bme { margin-left: 46px; background: #fde6d3; border-radius: 28px; padding: 16px; font-size: 22px; line-height: 1.35; }
  .bai { margin: 18px 18px 0 0; background: #fff; border: 1.5px solid var(--line); border-radius: 28px; padding: 20px 22px; font-size: 23px; line-height: 1.4; }
  .photo { position: relative; height: 196px; border-radius: 20px; background: #2b2724; display: grid; place-items: center; margin-bottom: 12px; }
  .dlg { width: 78%; background: #fff; border-radius: 12px; padding: 14px 16px; font-size: 15px; color: #222; }
  .dlg b { display: block; font-size: 16px; margin-bottom: 6px; }
  .dlg .row { display: flex; justify-content: space-between; margin-top: 12px; color: #2a62d6; font-weight: 700; }
  .btn { margin: 14px 18px 0 0; border: 1.5px solid var(--line); background: #fff; border-radius: 22px; padding: 16px; text-align: center; font: 800 21px var(--sans); }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .ring { position: absolute; border: 6px solid var(--accent2); border-radius: 14px; box-shadow: 0 0 0 5px rgba(255,255,255,.9); }
  .chip { position: absolute; background: var(--accent2); color: #fff; font: 800 16px var(--sans); padding: 5px 11px; border-radius: 10px; white-space: nowrap; }
  .notif { position: absolute; left: 16px; right: 16px; padding: 16px 18px; border-radius: 26px; background: rgba(245,240,235,.9); color: #1d1813; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }
  .notif .nh { display: flex; justify-content: space-between; font: 700 15px var(--sans); color: #6a5e53; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .notif b { display: block; font: 700 20px var(--sans); margin-bottom: 3px; }
  .notif p { font: 400 18px/1.3 var(--sans); }
  .sms { width: 84%; background: #e9e5e1; border-radius: 16px; padding: 12px 14px; font-size: 14.5px; line-height: 1.35; color: #222; }
  .verdict { margin: 18px 18px 0 0; border-radius: 28px; padding: 20px 22px; background: var(--danger-soft); border: 2px solid var(--danger); }
  .verdict h3 { color: var(--danger); font: 800 26px var(--sans); margin-bottom: 10px; }
  .verdict li { list-style: none; font-size: 20px; line-height: 1.35; padding-left: 26px; position: relative; margin-top: 8px; }
  .verdict li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .skill { background: #fff; border: 1.5px solid var(--line); border-radius: 24px; padding: 18px 20px; margin: 0 18px 14px 0; }
  .skill .top { display: flex; justify-content: space-between; font: 800 21px var(--sans); }
  .skill .lvl { font: 700 16px var(--sans); color: var(--muted); }
  .bars { display: flex; gap: 6px; margin-top: 12px; }
  .bars i { flex: 1; height: 12px; border-radius: 6px; background: #f3ede4; overflow: hidden; position: relative; display: block; }
  .bars i b { position: absolute; inset: 0; background: var(--accent2); transform-origin: left; transform: scaleX(0); }
  .bars.done i b { background: var(--success); }
  .note { margin: 6px 18px 0 0; background: #fff; border: 1.5px solid var(--line); border-radius: 28px; padding: 20px 22px; }
  .note .lbl { font: 800 16px var(--sans); color: #a8420a; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .note p { font-size: 21px; line-height: 1.42; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 34px 34px 0 0; padding: 30px 26px 44px; box-shadow: 0 -20px 50px -10px rgba(40,25,10,.35); }
  .sheet h3 { font: 800 30px var(--sans); margin-bottom: 8px; }
  .sheet p { font-size: 20px; color: var(--muted); line-height: 1.4; }
  .scrim { position: absolute; inset: 0; background: rgba(29,24,19,.38); }

  /* stat */
  .stat-num { font: 800 330px/1 var(--sans); letter-spacing: -14px; color: var(--accent); text-shadow: 0 10px 60px rgba(255,138,61,.35); }
  .stat-sub { font: 700 40px var(--sans); color: #fbf8f3; opacity: .9; }
  .stat-src { font: 600 24px var(--sans); color: #c9bcae; }

  /* logo moment */
  .mark { width: 300px; height: 300px; }
  .wordmark { font: 800 150px var(--sans); letter-spacing: -4px; }

  /* lesson card */
  .card { position: absolute; width: 640px; height: 800px; background: #fff; border-radius: 10px; padding: 56px 58px; color: var(--ink);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.5); }
  .card .k { font: 800 18px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .card h3 { font: 800 46px/1.1 var(--sans); margin: 14px 0 34px; }
  .step { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 30px; }
  .num { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 800 28px var(--sans); }
  .step p { font-size: 27px; line-height: 1.32; padding-top: 10px; }
  .stamp { position: absolute; right: 40px; top: 46px; border: 5px solid var(--success); color: var(--success); border-radius: 14px; padding: 8px 18px; font: 800 30px var(--sans); letter-spacing: .12em; }

  /* question marks */
  .q { font: 800 300px/1 var(--sans); color: var(--accent); }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 70; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="brand"></div>
  <div id="beats"></div>
  <div id="caption"></div>
  <div id="flash"></div>
  <canvas id="grain" width="2048" height="1208"></canvas>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeBack = k => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const ramp = (x, a, b) => clamp((x - a) / (b - a));

const TL = window.TIMELINE;
const DURATION = TL.total;
window.DURATION = DURATION;

// the brand mark: the open ring with a dot (same as the app icon)
const MARK = `<svg viewBox="0 0 512 512"><g transform="translate(78.4 78.4) scale(7.4)"><path d="M36.3 13.7A16 16 0 1 0 36.3 34.3" fill="none" stroke="#ff8a3d" stroke-width="7.5" stroke-linecap="round"/><circle cx="35.5" cy="24" r="4.75" fill="#fbf8f3"/></g></svg>`;
const MARK_ON_CREAM = MARK.replace('fill="#fbf8f3"', 'fill="#1d1813"');
$("#brand").innerHTML = `<span style="width:52px;height:52px;display:block">${MARK}</span>Companion`;

// --- phone builder ---------------------------------------------------------
const phone = (inner, cls = "") => `<div class="phone ${cls}" style="transform:scale(.8);transform-origin:top left"><div class="scr"><div class="island"></div><div class="sbar"><span>9:41</span><span>●●● ▮</span></div><div class="app">${inner}</div></div></div>`;
const appHead = `<div class="ahead"><span style="width:40px;height:40px;display:block">${MARK_ON_CREAM}</span>Companion</div>`;

// --- beat content -----------------------------------------------------------
// each beat has: a background class, optional inner HTML, and a function that animates it from local time lt
const BEAT = {
  hook: { bg: "dark", html: `<div class="abs" style="left:1300px;top:70px">${phone(`
      <div class="notif" id="hk-n" style="top:300px"><div class="nh"><span>Settings</span><span>now</span></div><b>Storage Almost Full</b><p>You can manage your storage in Settings.</p></div>`)}</div>` },
  hook2: { bg: "cream", html: `<div class="center" style="top:250px"><div class="q" id="q1">?</div></div>` },
  stat: { bg: "dark", html: `<div class="center" style="top:220px"><div class="stat-num" id="sn" style="font-size:230px;letter-spacing:-8px">$7.7 billion</div><div class="stat-sub" id="ss" style="display:none">lost to internet fraud in 2025</div><div class="stat-src" id="sr" style="margin-top:20px">People 60 and over · Source: FBI Internet Crime Report 2025 (IC3)</div></div>` },
  logo: { bg: "cream", html: `<div class="center" style="top:250px"><div id="lg-mark" style="width:300px;height:300px;margin:0 auto">${MARK_ON_CREAM}</div><div class="wordmark" id="lg-w" style="margin-top:16px">Companion</div></div>` },
  photo: { bg: "cream", html: `<div class="abs" style="left:1300px;top:70px">${phone(`${appHead}
      <div class="bme"><div class="photo" style="height:200px"><div class="dlg"><b>Storage Almost Full</b>You can manage your storage in Settings.<div class="row"><span>Close</span><span>Settings</span></div></div></div>What do I do with this?</div>`)}</div>` },
  ring: { bg: "cream", html: `<div class="abs" style="left:1300px;top:70px">${phone(`${appHead}
      <div class="bme"><div class="photo" style="height:200px;position:relative" id="rg-photo"><div class="ring" id="rg-ring" style="opacity:0"></div><div class="chip" id="rg-chip" style="opacity:0">Tap here</div><div class="dlg"><b>Storage Almost Full</b>You can manage your storage in Settings.<div class="row"><span>Close</span><span id="rg-target">Settings</span></div></div></div>What do I do with this?</div>
      <div class="bai" id="rg-ai">Let's start by tapping <b>Settings</b>, in the bottom right of that box.</div>`)}
      </div>` },
  wait: { bg: "cream", html: `<div class="abs" style="left:1300px;top:70px">${phone(`${appHead}
      <div class="bai">Tap <b>Settings</b>, then <b>Storage</b>. Tell me when you're there.</div>
      <div class="btn" id="wt-b1">I've done it</div>
      <div class="btn" id="wt-b2">Show me again</div>`)}</div>` },
  verdict: { bg: "dark", html: `<div class="abs" style="left:1300px;top:70px">${phone(`${appHead}
      <div class="bme"><div class="photo" style="height:160px"><div class="sms">Parcel Delivery: your parcel is on hold. Pay now to avoid return: http://parcel-redelivery-uk.info</div></div>Is this a scam?</div>
      <div class="verdict" id="vd"><h3>This looks like a scam</h3>
        <ul><li id="vr1">It asks you to pay through a link</li><li id="vr2">The web address isn't the real company's</li><li id="vr3">It tries to rush you</li></ul>
        <div style="margin-top:14px;font-weight:700;font-size:20px;line-height:1.35">Don't tap the link. Check on the company's own website.</div></div>`)}</div>` },
  skills: { bg: "cream", html: `<div class="abs" style="left:1300px;top:70px">${phone(`${appHead}
      <div style="padding:0 4px"><div style="font:800 34px var(--sans);margin:6px 0">My Skills</div><div style="font-size:19px;color:var(--muted);margin-bottom:18px">Look how far you've come.</div></div>
      <div id="sk-rows"></div>`)}</div>` },
  family: { bg: "cream", html: `<div class="abs" style="left:1300px;top:70px">${phone(`${appHead}
      <div class="note"><div class="lbl">Help card for Anna</div><p>Hi Anna, I'm trying to set up video calls. Could you help me on Sunday?</p></div>
      <div class="btn primary" id="fm-b1">Send to my daughter (Anna)</div>
      <div class="scrim" id="fm-scrim" style="opacity:0"></div>
      <div class="sheet" id="fm-sheet" style="transform:translateY(420px)"><h3>Send this to Anna?</h3><p>Nothing is sent until you choose.</p><div class="btn primary" id="fm-yes" style="margin-right:0">Yes, share it</div></div>`)}</div>` },
  lesson: { bg: "dark", html: `<div class="card" id="cd" style="left:1180px;top:110px;transform:scale(.86) rotate(-4deg)">
      <div class="k">My lesson card</div><h3>How to join the<br>Wi‑Fi at home</h3>
      <div class="step"><div class="num">1</div><p>Open <b>Settings</b>. It's the grey gear.</p></div>
      <div class="step"><div class="num">2</div><p>Tap <b>Wi‑Fi</b> near the top.</p></div>
      <div class="step"><div class="num">3</div><p>Tap your network's name.</p></div>
      <div class="step"><div class="num">4</div><p>Type the password, then tap <b>Join</b>.</p></div>
      <div class="stamp" id="st" style="opacity:0">LEARNED</div></div>` },
  end: { bg: "dark", html: `<div class="center" style="top:130px"><div style="width:220px;height:220px;margin:0 auto" id="en-mark">${MARK}</div>
      <div class="wordmark" id="en-w" style="font-size:118px;margin-top:14px">Companion</div>
      <div id="en-t" style="font:700 32px var(--sans);color:#c9bcae;margin-top:16px">A patient tech helper for older adults · Ice Hacks 2026</div></div>` },
};

// build the beats once
const beatsEl = $("#beats");
TL.beats.forEach((b, i) => {
  const def = BEAT[b.kind] || BEAT.logo;
  const d = document.createElement("section");
  d.className = "beat " + def.bg; d.id = "b" + i;
  d.innerHTML = def.html;
  beatsEl.appendChild(d);
});

// rough word-by-word caption: words light up as the voice says them
const capEl = $("#caption");
// The caption is the line being spoken. It fades in as the voice starts it and fades out before the next beat,
// so the words on screen and the words in the voice are always the same line at the same moment.
function setCaption(b, lt) {
  if (capEl.dataset.key !== b.id) {
    capEl.dataset.key = b.id;
    capEl.textContent = b.caption;
  }
  const onCream = BEAT[b.kind] && BEAT[b.kind].bg === "cream";
  const orange = BEAT[b.kind] && BEAT[b.kind].bg === "orange";
  capEl.style.color = onCream || orange ? "#1d1813" : "#fbf8f3";
  const speechStart = b.speechStart - b.start;
  const inK = ramp(lt, speechStart - .1, speechStart + .45);
  const outK = ramp(lt, b.dur - .45, b.dur - .05);
  capEl.style.opacity = (easeOut(inK) * (1 - easeOut(outK))).toFixed(4);
  capEl.style.transform = `translateY(${((1 - easeOut(inK)) * 14).toFixed(2)}px)`;
}

// per-kind animation: lt = local time in this beat, dur = beat length
function animate(b, i, lt) {
  const root = $("#b" + i);
  const q = s => root.querySelector(s) || document.getElementById(s.replace("#", ""));
  switch (b.kind) {
    case "hook": {
      const n = $("#hk-n");
      const k = easeBack(ramp(lt, .2, .75));
      n.style.transform = `translateY(${(1 - k) * -60}px) scale(${lerp(.9, 1, k)})`;
      n.style.opacity = clamp(ramp(lt, .2, .5));
      break;
    }
    case "hook2": {
      const q1 = $("#q1");
      const k = easeBack(ramp(lt, 0, .45));
      q1.style.transform = `scale(${lerp(.4, 1, k)})`;
      q1.style.opacity = clamp(ramp(lt, 0, .2));
      break;
    }
    case "stat": {
      const sn = $("#sn"), ss = $("#ss"), sr = $("#sr");
      const k = easeBack(ramp(lt, 0, .32));
      sn.style.transform = `scale(${lerp(1.5, 1, k)})`;
      sn.style.opacity = clamp(ramp(lt, 0, .12));
      ss.style.opacity = clamp(ramp(lt, .55, .9)); ss.style.transform = `translateY(${(1 - easeOut(ramp(lt, .55, .9))) * 22}px)`;
      sr.style.opacity = clamp(ramp(lt, 1.2, 1.6));
      break;
    }
    case "logo": {
      const m = $("#lg-mark"), w = $("#lg-w");
      const k = easeBack(ramp(lt, 0, .5));
      m.style.transform = `scale(${lerp(.3, 1, k)})`; m.style.opacity = clamp(ramp(lt, 0, .2));
      w.style.opacity = clamp(ramp(lt, .6, 1.0)); w.style.transform = `translateY(${(1 - easeOut(ramp(lt, .6, 1))) * 30}px)`;
      break;
    }
    case "photo": {
      // camera flash at the start of the beat
      const f = $("#flash");
      f.style.opacity = lt < .18 ? (1 - lt / .18) * .85 : 0;
      break;
    }
    case "ring": {
      const ring = $("#rg-ring"), chip = $("#rg-chip"), ai = $("#rg-ai"), tgt = $("#rg-target");
      if (!ring.dataset.placed) {   // put the ring on "Settings" (layout measured, unscaled)
        ring.dataset.placed = 1;
        Object.assign(ring.style, { left: tgt.offsetLeft - 10 + "px", top: tgt.offsetTop - 8 + "px", width: tgt.offsetWidth + 20 + "px", height: tgt.offsetHeight + 16 + "px" });
        Object.assign(chip.style, { left: tgt.offsetLeft - 10 + "px", top: tgt.offsetTop + tgt.offsetHeight + 12 + "px" });
      }
      const k = easeOut(ramp(lt, .5, 1.0));
      ring.style.opacity = k; ring.style.transform = `scale(${lerp(1.6, 1, k)})`;
      const pulse = ramp(lt, 1.2, 9) > 0 ? ((lt - 1.2) % 1.2) / 1.2 : 0;
      ring.style.boxShadow = `0 0 0 5px rgba(255,255,255,.9), 0 0 0 ${5 + pulse * 22}px rgba(212,88,10,${(1 - pulse) * .45})`;
      chip.style.opacity = clamp(ramp(lt, 1.0, 1.3));
      ai.style.opacity = clamp(ramp(lt, 1.4, 1.9)); ai.style.transform = `translateY(${(1 - easeOut(ramp(lt, 1.4, 1.9))) * 18}px)`;
      break;
    }
    case "wait": {
      const b1 = $("#wt-b1");
      const pulse = Math.sin(clamp(ramp(lt, .6, 2.2)) * Math.PI * 3) * .5 + .5;
      b1.style.background = ramp(lt, 1.6, 1.7) > 0 && lt > 1.6 ? "#1d1813" : "#fff";
      b1.style.color = lt > 1.6 ? "#fffaf2" : "#1d1813";
      b1.style.transform = `scale(${1 + (lt > 1.4 && lt < 1.8 ? .04 : 0)})`;
      b1.style.boxShadow = `0 0 0 ${pulse * 10}px rgba(212,88,10,${.35 * (1 - pulse)})`;
      break;
    }
    case "verdict": {
      const v = $("#vd"); const k = easeBack(ramp(lt, 0, .5));
      v.style.transform = `scale(${lerp(.92, 1, k)})`; v.style.opacity = clamp(ramp(lt, 0, .3));
      ["#vr1", "#vr2", "#vr3"].forEach((id, j) => { const e = $(id); e.style.opacity = clamp(ramp(lt, .6 + j * .35, .9 + j * .35)); });
      break;
    }
    case "skills": {
      const rows = $("#sk-rows");
      if (!rows.dataset.built) {
        rows.dataset.built = 1;
        const L = [["Join the Wi‑Fi", 5], ["Send a photo", 4], ["Make a video call", 3], ["Spot a scam text", 2]];
        rows.innerHTML = L.map(([n]) => `<div class="skill"><div class="top"><span>${n}</span><span class="lvl"></span></div><div class="bars">${'<i><b></b></i>'.repeat(5)}</div></div>`).join("");
        rows.dataset.levels = JSON.stringify(L.map(x => x[1]));
      }
      const levels = JSON.parse(rows.dataset.levels);
      const cards = $$(".skill", rows);
      cards.forEach((card, j) => {
        const start = .4 + j * .3;
        const prog = levels[j] * easeOut(ramp(lt, start + .6, start + 2.6));
        $$(".bars i b", card).forEach((bb, n) => bb.style.transform = `scaleX(${clamp(prog - n).toFixed(3)})`);
        const lv = Math.max(1, Math.floor(prog + 1e-6));
        $(".lvl", card).textContent = `Level ${lv}`;
        $(".bars", card).classList.toggle("done", lv === 5);
        card.style.opacity = clamp(ramp(lt, start, start + .35));
      });
      break;
    }
    case "family": {
      const sheet = $("#fm-sheet"), sc = $("#fm-scrim");
      const k = easeOut(ramp(lt, 1.5, 2.3));
      sheet.style.transform = `translateY(${(1 - k) * 420}px)`;
      sc.style.opacity = k * .9;
      break;
    }
    case "lesson": {
      const st = $("#st");
      const k = easeBack(ramp(lt, 1.0, 1.4));
      st.style.opacity = clamp(ramp(lt, 1.0, 1.15));
      st.style.transform = `rotate(9deg) scale(${lerp(1.8, 1, k)})`;
      const cd = $("#cd"); cd.style.transform = `scale(.86) rotate(-4deg) translateY(${(1 - easeOut(ramp(lt, 0, .5))) * 260}px)`;
      break;
    }
    case "end": {
      const w = $("#en-w"), t2 = $("#en-t");
      w.style.opacity = clamp(ramp(lt, .3, .9)); t2.style.opacity = clamp(ramp(lt, 1.1, 1.7));
      break;
    }
  }
  // the ring-bg pulse behind any dark stat/logo beat is drawn by the grain layer; nothing else to animate
}

// --- render ------------------------------------------------------------------
function render(t) {
  t = clamp(t, 0, DURATION - 0.001);
  let idx = TL.beats.findIndex(b => t >= b.start && t < b.start + b.dur);
  if (idx < 0) idx = TL.beats.length - 1;
  TL.beats.forEach((b, i) => { $("#b" + i).style.display = i === idx ? "block" : "none"; });
  const b = TL.beats[idx], lt = t - b.start;
  $("#b" + idx).style.opacity = easeOut(ramp(lt, 0, .5)).toFixed(4);   // each scene fades in, nothing jumps
  animate(b, idx, lt);
  setCaption(b, lt);
  // the lesson beat is orange, so its caption is ink; every other caption is white, or ink on cream
  $("#grain").style.transform = `translate(${((Math.floor(t * 30) * 37) % 64) - 32}px, ${((Math.floor(t * 30) * 53) % 64) - 32}px)`;
  if (!(lt < .18 && b.kind === "photo")) $("#flash").style.opacity = 0;
  // fade out at the very end
  $("#stage").style.filter = "none";
  if (t > DURATION - .8) $("#stage").style.opacity = clamp((DURATION - t) / .8);
  else $("#stage").style.opacity = 1;
}

// grain, seeded so every render is identical (mulberry32)
(function grain() {
  const c = $("#grain"), g = c.getContext("2d"), img = g.createImageData(c.width, c.height);
  let s = 1234567;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let x = Math.imul(s ^ s >>> 15, 1 | s); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + rnd() * 145; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
})();

window.render = render;
window.ready = document.fonts.ready.then(() => { render(0); return true; });

// live preview when opened directly (the renderer adds ?render)
if (!location.search.includes("render")) {
  let t0 = performance.now(), offset = 0, playing = true;
  const tick = () => { if (playing) render((offset + (performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
  window.ready.then(tick);
  addEventListener("click", () => { if (playing) offset += (performance.now() - t0) / 1000; else t0 = performance.now(); playing = !playing; });
  addEventListener("keydown", e => { const d = e.key === "ArrowRight" ? 5 : e.key === "ArrowLeft" ? -5 : 0; if (d) { offset = Math.max(0, offset + (performance.now() - t0) / 1000 + d); t0 = performance.now(); } });
}
</script>
